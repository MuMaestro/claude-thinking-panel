# Config for claude-think's ISOLATED tmux (socket -L claude-think).
# Never read by a "normal" tmux: only the wrapper passes -f pointing here.
# Goal: look like a plain terminal with one extra pane — no status bar,
# no prefix, no shortcuts beyond the two below.

set -g status off
set -s escape-time 0
set -g mouse on
set -g history-limit 50000
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:Tc"

# No prefix: no tmux shortcut steals a key from Claude Code (which uses
# Ctrl+B for background, Esc, etc.).
set -g prefix None
unbind C-b

# Ctrl+Z suspends the tmux CLIENT, not the claude inside the pane: you land
# on your original prompt with the job stopped, and `fg` restores everything
# as it was — same semantics as suspending bare claude.
bind -n C-z suspend-client

# F9 toggles the viewer pane without leaving the session.
bind -n F9 if-shell -F '#{==:#{window_panes},1}' \
  'split-window -h -l 38% "claude-watch"; select-pane -t 0' \
  'kill-pane -t 1'
